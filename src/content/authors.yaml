# 記事の署名。記事の frontmatter の authors にここの id を書く。
# member は、その署名の部員 (src/content/members/<名前>.md の <名前>)。書くと、記事の署名がメンバー紹介の
# その人へのリンクになり、メンバー紹介からその人の記事一覧 (/author/<id>/) へ行けるようになる。
# 団体名義や、部員のファイルが無い人 (卒業・退部した人) は member を書かない。
# 部員の署名の id は、部員のファイル名と同じにしている
# description は、その署名の記事一覧の先頭に出す説明 (任意)

