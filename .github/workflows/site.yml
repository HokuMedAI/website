name: site

# PR は check + test + build まで、master への push はそのまま Cloudflare Workers へデプロイ
# (static assets と、お問い合わせフォームを受ける Worker スクリプト worker/index.ts を wrangler deploy が一緒に上げる)。
# Worker 名・assets・binding の設定はルートの wrangler.jsonc。
# paths フィルタは付けない: このサイトは src/content/ の Markdown と YAML が中身なので、それだけの変更でもデプロイする。
# 必要な secrets: CLOUDFLARE_API_TOKEN (Account: Workers Scripts: Edit) / CLOUDFLARE_ACCOUNT_ID /
# DISCORD_WEBHOOK_URL (お問い合わせフォームの届け先。デプロイのたびに Worker の secret として入れ直す) /
# DISCORD_DEPLOY_WEBHOOK_URL (デプロイ完了の知らせを流す Webhook。CI だけが使い、Worker には入れない)
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager から取る (version を書くと二重指定で落ちる)
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 型と、記事・部員・研究の frontmatter / YAML の検査 (項目の打ち間違いはここで落ちる)
      - name: Check
        run: pnpm check

      # Worker (worker/) は astro check の対象外 (tsconfig を分けてある) なので、ここで型を検査する。
      # 1 行目は、生成した型 (worker/worker-configuration.d.ts) が wrangler.jsonc と食い違っていないかの確認
      - name: Check worker
        run: |
          pnpm wrangler types worker/worker-configuration.d.ts --env-file .dev.vars.example --check
          pnpm exec tsc -p worker

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # ここに並べた名前の環境変数を、Worker の secret として登録する (値は下の env から)
          secrets: |
            DISCORD_WEBHOOK_URL
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # デプロイが済んでから Discord に知らせる。repo の Webhook は push の時点で流れるので、まだ古いサイトが出ているうちに
      # 通知が届いてしまう (だからそちらは止めてある)。途中のどこか (検査・テスト・ビルド・デプロイ) で落ちたときは、
      # 失敗として知らせる (リンク先はこの実行のログ)。知らせるのに失敗しても、ジョブの成否は変えない
      - name: Notify Discord
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        continue-on-error: true
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq --arg status "$JOB_STATUS" --arg run "$RUN_URL" '{
            embeds: [{
              title: (if $status == "success" then "デプロイ完了" else "デプロイ失敗" end + ": aiken.prism-hu.org"),
              url: (if $status == "success" then "https://aiken.prism-hu.org/" else $run end),
              color: (if $status == "success" then 3066993 else 15158332 end),
              description: (
                [.commits[:10][] | "[`\(.id[:7])`](\(.url)) \(.message | split("\n")[0][:100]) - \(.author.username // .author.name)"]
                + (if (.commits | length) > 10 then ["ほか \((.commits | length) - 10) 件"] else [] end)
                | join("\n")
              )
            }],
            allowed_mentions: { parse: [] }
          }' "$GITHUB_EVENT_PATH" |
            curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_DEPLOY_WEBHOOK_URL"
